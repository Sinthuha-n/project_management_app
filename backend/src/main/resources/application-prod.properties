# Production connection budget: the EC2 deployment runs one backend instance, so
# 12 Hikari connections stay below the conservative 15-connection Supavisor backend
# pool allocation (and below the smallest Supabase Postgres max_connections of 60).
# Update both values from the provider dashboard before horizontally scaling.
app.database.pool.instance-count=${DB_POOL_INSTANCE_COUNT:1}
app.database.pool.connection-budget=${DB_POOL_CONNECTION_BUDGET:15}

# 60 seconds catches connections held far beyond normal request work without the
# false positives caused by a development-style 2-10 second threshold under load.
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_THRESHOLD:60000}

# Keep SQL-count visibility in production, but never turn a diagnostic threshold
# into a customer-facing 5xx. Production gets a higher warning threshold than dev
# to accommodate intentional aggregate endpoints and reduce noisy logs.
nplus1.guard.enabled=${NPLUS1_GUARD_ENABLED:true}
nplus1.guard.warn-threshold=${NPLUS1_GUARD_WARN_THRESHOLD:25}
nplus1.guard.fail-threshold=${NPLUS1_GUARD_FAIL_THRESHOLD:180}
nplus1.guard.fail-on-exceed=false
nplus1.guard.slow-request-threshold-ms=${NPLUS1_GUARD_SLOW_REQUEST_THRESHOLD_MS:750}

# Production migration history fails closed by default. Recovery operations are
# opt-in for a single controlled deployment rather than permanent defaults.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
spring.flyway.ignore-migration-patterns=${FLYWAY_IGNORE_MIGRATION_PATTERNS:}
