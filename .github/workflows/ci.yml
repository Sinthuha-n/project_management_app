name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "test", "responsive-pages", "responsive-pages-*" ]
  pull_request:
    branches: [ "main", "master", "test", "responsive-pages", "responsive-pages-*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Check path changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
            - '.github/workflows/ci.yml'
          frontend:
            - 'frontend/web/**'
            - '.github/workflows/ci.yml'
          mobile:
            - 'frontend/mobile/**'
            - '.github/workflows/ci.yml'
          contracts:
            - 'backend/**'
            - 'frontend/web/**'
            - 'frontend/mobile/**'
            - 'frontend/api-contracts/**'
            - 'scripts/check-api-contracts.mjs'
            - 'scripts/generate-api-contracts.mjs'
            - '.github/workflows/ci.yml'


  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks Scan
      run: |
        VERSION="8.30.1"
        curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        tar -xzf gitleaks.tar.gz gitleaks
        chmod +x ./gitleaks
        ./gitleaks detect --source=. -v --redact
    - name: Run Trivy Security Scan (Backend)
      run: |
        docker run --rm \
          --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
          --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
          aquasec/trivy:0.70.0 fs \
          --exit-code 1 \
          --severity CRITICAL,HIGH \
          --vuln-type library \
          /workspace/backend

  backend-build:
    name: Build Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Verify Docker is available for integration tests
      run: docker info
      
    - name: Check for Empty Flyway Migrations
      run: |
        EMPTY_FILES=$(find src/main/resources/db/migration -type f -empty 2>/dev/null || true)
        if [ -n "$EMPTY_FILES" ]; then
          echo "Error: Found empty Flyway migration files:"
          echo "$EMPTY_FILES"
          exit 1
        fi
        echo "No empty Flyway migration files found."
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Ensure mvnw is executable
      run: chmod +x mvnw

    - name: Run Backend Verification
      env:
        CI: true
      run: ./mvnw -B verify --file pom.xml

    - name: Require executed integration tests
      run: |
        REPORT=target/failsafe-reports/failsafe-summary.xml
        test -f "$REPORT"
        COMPLETED=$(sed -n 's:.*<completed>\([0-9][0-9]*\)</completed>.*:\1:p' "$REPORT")
        test "${COMPLETED:-0}" -gt 0
        grep -q '<errors>0</errors>' "$REPORT"
        grep -q '<failures>0</failures>' "$REPORT"
        grep -q '<skipped>0</skipped>' "$REPORT"

    - name: Publish Backend Test and Coverage Reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: backend-quality-reports
        if-no-files-found: warn
        path: |
          backend/target/surefire-reports/**
          backend/target/failsafe-reports/**
          backend/target/site/jacoco-unit/**
          backend/target/site/jacoco-integration/**
          backend/target/dependency-check-report.*
      
  frontend-build:
    name: Build Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CI: true
    defaults:
      run:
        working-directory: ./frontend/web

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'frontend/web/.nvmrc'
        cache: 'npm'
        cache-dependency-path: './frontend/web/package-lock.json'

    - name: Cache Next.js Build
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/frontend/web/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/web/package-lock.json') }}-${{ hashFiles('frontend/web/**/*.js', 'frontend/web/**/*.jsx', 'frontend/web/**/*.ts', 'frontend/web/**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('frontend/web/package-lock.json') }}-
        
    - name: Install Dependencies
      run: npm ci

    - name: Audit Dependencies (Explicit Policy)
      run: npm run security-audit

    - name: Lint Next.js App
      run: npm run lint

    - name: TypeScript Check
      run: npm run typecheck

    - name: Check for Hardcoded Localhost Backend URLs
      run: |
        MATCHES=$(grep -rn "localhost:8080" \
          --include="*.ts" \
          --include="*.tsx" \
          --include="*.js" \
          --include="*.jsx" \
          --exclude="*.test.ts" \
          --exclude="*.test.tsx" \
          --exclude="*.spec.ts" \
          --exclude="*.spec.tsx" \
          --exclude="next.config.*" \
          --exclude="api-base-url.ts" \
          --exclude-dir=".next" \
          --exclude-dir="node_modules" \
          --exclude-dir="api" \
          . 2>/dev/null || true)
        if [ -n "$MATCHES" ]; then
          echo "❌ Hardcoded localhost:8080 found in production frontend source files:"
          echo "$MATCHES"
          echo ""
          echo "Fix: Use getApiBaseUrl() from @/lib/api-base-url instead of hardcoding the backend URL."
          exit 1
        fi
        echo "✅ No hardcoded localhost backend URLs found."

    - name: Run Frontend Tests
      run: npm run test

    - name: Build Next.js App
      run: npm run build

    - name: Validate PWA Assets
      run: npm run pwa:check

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/web/package-lock.json') }}

    - name: Install Browser Test Runtime
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      timeout-minutes: 2
      run: npx playwright install chromium

    - name: Run Production-Fix Browser Tests
      timeout-minutes: 2
      run: npm run test:e2e

    - name: Upload Browser Test Report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: frontend-playwright-report
        path: frontend/web/playwright-report/**
        if-no-files-found: ignore

  api-contracts:
    name: Validate API Contracts
    needs: [changes, backend-build, frontend-build, mobile-build]
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true') && (needs.backend-build.result == 'success' || needs.backend-build.result == 'skipped') && (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') && (needs.mobile-build.result == 'success' || needs.mobile-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      API_CONTRACT_MAX_CRITICAL_ISSUES: 0

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'frontend/web/.nvmrc'
        cache: 'npm'
        cache-dependency-path: './frontend/web/package-lock.json'

    - name: Install Contract Generator Dependencies
      working-directory: ./frontend/web
      run: npm ci

    - name: Check Generated OpenAPI Types
      run: node scripts/generate-api-contracts.mjs --check

    - name: Validate API Route Contracts
      run: node scripts/check-api-contracts.mjs --report artifacts/api-contracts/report.txt

    - name: Upload API Contract Report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-contract-report
        path: artifacts/api-contracts/report.txt

  mobile-build:
    name: Build Mobile
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CI: true
    defaults:
      run:
        working-directory: ./frontend/mobile

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'frontend/mobile/.nvmrc'
        cache: 'npm'
        cache-dependency-path: './frontend/mobile/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci

    - name: Expo Doctor Check
      run: npx expo-doctor
      continue-on-error: true

    - name: Lint Mobile App
      run: npm run lint

    - name: TypeScript Check
      run: npm run typecheck

    - name: Run Mobile Tests
      run: npm run test

    - name: Smoke Check EAS Build Profiles
      run: |
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
        const requiredProfiles = ['development', 'preview', 'production'];
        for (const profile of requiredProfiles) {
          if (!config.build[profile]) {
            console.error('Missing required build profile: ' + profile);
            process.exit(1);
          }
        }
        console.log('EAS build profiles validated successfully!');
        "
