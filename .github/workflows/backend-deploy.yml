name: Backend Deploy

on:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/**"
      - "docker-compose.ec2.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image Metadata
        id: meta
        run: |
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER}/planora-backend"
          IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Required Secrets
        run: |
          missing=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Error: EC2_HOST secret is not set."
            missing=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "Error: EC2_USER secret is not set."
            missing=1
          fi
          if [ -z "${{ secrets.EC2_APP_DIR }}" ]; then
            echo "Error: EC2_APP_DIR secret is not set."
            missing=1
          fi
          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            echo "Error: EC2_SSH_PRIVATE_KEY secret is not set."
            missing=1
          fi
          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "Error: GHCR_READ_TOKEN secret is not set."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          CLEAN_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '\r\n[:space:]')
          echo "Scanning host keys for ${CLEAN_HOST}..."
          ssh-keyscan -H "${CLEAN_HOST}" >> ~/.ssh/known_hosts || {
            echo "========================================= ERROR ========================================="
            echo "ssh-keyscan failed to retrieve host keys from ${CLEAN_HOST}."
            echo "This usually means one of the following:"
            echo "  1. The EC2 instance is stopped or offline."
            echo "  2. The EC2_HOST secret in GitHub is incorrect or has changed."
            echo "  3. Inbound port 22 (SSH) is blocked on the EC2 security group for GitHub Actions runner IPs."
            echo "========================================================================================="
            exit 1
          }

      - name: Deploy Backend Container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          CLEAN_USER=$(echo "${EC2_USER}" | tr -d '\r\n[:space:]')
          CLEAN_HOST=$(echo "${EC2_HOST}" | tr -d '\r\n[:space:]')
          CLEAN_APP_DIR=$(echo "${EC2_APP_DIR}" | tr -d '\r\n[:space:]')
          ssh -i ~/.ssh/ec2_deploy_key "${CLEAN_USER}@${CLEAN_HOST}" \
            "cd '${CLEAN_APP_DIR}' \
            && git fetch origin '${DEPLOY_BRANCH}' \
            && git pull --ff-only origin '${DEPLOY_BRANCH}' \
            && bash scripts/repair-production-backend-env.sh .env.production \
            && bash scripts/validate-production-env.sh .env.production \
            && printf '%s' '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin \
            && BACKEND_IMAGE='${BACKEND_IMAGE}' docker compose -f docker-compose.ec2.yml --env-file .env.production pull backend \
            && BACKEND_IMAGE='${BACKEND_IMAGE}' docker compose -f docker-compose.ec2.yml --env-file .env.production up -d --no-build backend redis \
            && docker image prune -f"
