name: Scheduled Backend Quality

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Critical Mutation Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21 and Maven caches
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run PIT quality gate
        run: ./scripts/run-maven.sh -B -Djacoco.skip=true -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Publish PIT quality summary
        if: ${{ always() }}
        run: |
          REPORT=target/pit-reports/mutations.xml
          HTML_REPORT=target/pit-reports/index.html
          test -s "${REPORT}"
          test -s "${HTML_REPORT}"

          count_status() {
            grep -c "status='$1'" "${REPORT}" || true
          }

          GENERATED=$(grep -c '<mutation ' "${REPORT}" || true)
          KILLED=$(count_status KILLED)
          SURVIVED=$(count_status SURVIVED)
          NO_COVERAGE=$(count_status NO_COVERAGE)
          COVERED=$((GENERATED - NO_COVERAGE))
          MUTATION_SCORE=$(awk -v killed="${KILLED}" -v total="${GENERATED}" 'BEGIN { printf "%.0f", total ? (100 * killed / total) : 0 }')
          TEST_STRENGTH=$(awk -v killed="${KILLED}" -v covered="${COVERED}" 'BEGIN { printf "%.0f", covered ? (100 * killed / covered) : 0 }')

          {
            echo '## Backend mutation quality'
            echo
            echo '| Metric | Current | Gate | Long-term target |'
            echo '| --- | ---: | ---: | ---: |'
            echo "| Generated mutants | ${GENERATED} | — | — |"
            echo "| Killed | ${KILLED} | — | — |"
            echo "| Survived | ${SURVIVED} | — | — |"
            echo "| No coverage | ${NO_COVERAGE} | — | — |"
            echo "| Mutation score | ${MUTATION_SCORE}% | 40% | 70% |"
            echo "| Test strength | ${TEST_STRENGTH}% | 65% | 85% |"
            echo
            echo 'The 40/65 gates are the current whole-service baseline and may only ratchet upward.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload PIT report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-pit-report
          if-no-files-found: warn
          retention-days: 14
          path: backend/target/pit-reports/**

  stability:
    name: Unit Suite Stability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21 and Maven caches
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Repeat unit suite three times
        run: |
          for run in 1 2 3; do
            echo "Unit stabilization run ${run}/3"
            ./scripts/run-maven.sh -B test
            test -n "$(find target/surefire-reports -name 'TEST-*.xml' -print -quit)"
            if grep -Eqs ' (errors|failures|skipped)="[1-9][0-9]*"' target/surefire-reports/TEST-*.xml; then
              echo "Unit stabilization run ${run} contained errors, failures, or skipped tests." >&2
              exit 1
            fi
          done

      - name: Upload stability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-stability-reports
          if-no-files-found: warn
          retention-days: 14
          path: backend/target/surefire-reports/**

  zap:
    name: ZAP OpenAPI API Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planora_zap
          POSTGRES_USER: planora
          POSTGRES_PASSWORD: planora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U planora -d planora_zap"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mailhog:
        image: mailhog/mailhog
        ports:
          - 2525:1025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21 and Maven caches
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start and verify ephemeral backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/planora_zap
          SPRING_DATASOURCE_USERNAME: planora
          SPRING_DATASOURCE_PASSWORD: planora
          JWT_SECRET: dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktMzJieXQ=
          MAIL_HOST: localhost
          MAIL_PORT: 2525
          MAIL_USERNAME: integration
          MAIL_PASSWORD: integration
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: 'false'
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: 'false'
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: 'false'
          AWS_ACCESS_KEY: test
          AWS_SECRET_KEY: test
          AWS_REGION: us-east-1
          AWS_PROFILE_PHOTOS_BUCKET: zap-profile
          AWS_DMS_BUCKET: zap-documents
          AWS_CHAT_BUCKET: zap-chat
          AWS_TASK_STORAGE_BUCKET: zap-tasks
          GITHUB_SYNC_ENABLED: 'false'
          SPRINGDOC_API_DOCS_ENABLED: 'true'
        run: |
          set -Eeuo pipefail
          BACKEND_LOG="${RUNNER_TEMP}/backend-zap.log"
          BACKEND_PID_FILE="${RUNNER_TEMP}/backend-zap.pid"
          OPENAPI_SNAPSHOT="${RUNNER_TEMP}/backend-openapi.json"

          ./scripts/run-maven.sh -q -DskipTests spring-boot:run >"${BACKEND_LOG}" 2>&1 &
          BACKEND_PID=$!
          echo "${BACKEND_PID}" > "${BACKEND_PID_FILE}"

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${BACKEND_PID}" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "${ready}" != true ]; then
            echo 'Backend failed to become ready. Recent application log:' >&2
            tail -n 200 "${BACKEND_LOG}" >&2 || true
            exit 1
          fi

          curl --fail --silent http://localhost:8080/actuator/health >/dev/null
          curl --fail --silent http://localhost:8080/v3/api-docs --output "${OPENAPI_SNAPSHOT}"
          jq -e '.openapi and (.paths | type == "object")' "${OPENAPI_SNAPSHOT}" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/)" = '401'

      - name: Scan OpenAPI surface
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8080/v3/api-docs
          format: openapi
          fail_action: true
          allow_issue_writing: false
          rules_file_name: .zap/backend-api-rules.tsv
          cmd_options: -n .zap/backend-api.context
          artifact_name: backend-zap-report

      - name: Upload ZAP runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-zap-runtime
          if-no-files-found: warn
          retention-days: 14
          path: |
            report_html.html
            report_json.json
            report_md.md
            ${{ runner.temp }}/backend-zap.log
            ${{ runner.temp }}/backend-openapi.json

      - name: Stop ephemeral backend
        if: ${{ always() }}
        run: |
          BACKEND_PID_FILE="${RUNNER_TEMP}/backend-zap.pid"
          if [ -s "${BACKEND_PID_FILE}" ]; then
            BACKEND_PID=$(cat "${BACKEND_PID_FILE}")
            kill "${BACKEND_PID}" 2>/dev/null || true
            wait "${BACKEND_PID}" 2>/dev/null || true
          fi
