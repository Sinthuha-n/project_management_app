<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155DFC" />
    <title>Planora is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #101828;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 48px rgba(16, 24, 40, 0.10);
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #155dfc, #9810fa 58%, #f6339a);
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #667085;
        font-size: 15px;
        line-height: 1.55;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        background: #155dfc;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>You are offline</h1>
      <p>Planora needs a connection for live project data. Reconnect to continue planning, tracking, and shipping with the latest workspace state.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
