<svg width="370" height="120" viewBox="0 0 370 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Planora lockup — "the delivery track". Resting state of the animated
       web mark: track complete, work item shipped at the top stage. -->
  <defs>
    <linearGradient id="planora-ramp" x1="6" y1="12" x2="102" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155DFC"/>
      <stop offset="0.52" stop-color="#9810FA"/>
      <stop offset="1" stop-color="#F6339A"/>
    </linearGradient>
    <radialGradient id="planora-gloss" cx="0.26" cy="0.18" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planora-word" x1="118" y1="30" x2="350" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155DFC"/>
      <stop offset="0.55" stop-color="#9810FA"/>
      <stop offset="1" stop-color="#F6339A"/>
    </linearGradient>
  </defs>

  <!-- Mark, scaled 2x from the 48-unit grid -->
  <g transform="translate(6 12) scale(2)">
    <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#planora-ramp)"/>
    <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#planora-gloss)"/>
    <rect x="3.6" y="3.6" width="40.8" height="40.8" rx="12.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
    <path d="M 12.75 31.5 H 20.25 V 24 H 27.75 V 16.5 H 35.25" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <rect x="31.5" y="12.75" width="7.5" height="7.5" rx="2.4" fill="#FFFFFF"/>
  </g>

  <text x="118" y="79" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-2.2" fill="url(#planora-word)">planora</text>
</svg>
